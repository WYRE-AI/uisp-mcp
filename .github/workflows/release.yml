name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker → MCP Registry → security chain (tag-based release
# detection + correct gating) lives in wyre-technology/.github so every *-mcp
# repo stays in lockstep instead of drifting per-repo. Caller jobs grant the
# token scopes the reusable jobs request (a reusable can only reduce, never
# expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write # @semantic-release/github success step reads/comments on PRs
      packages: write
      id-token: write
      security-events: write
    uses: wyre-technology/.github/.github/workflows/mcp-server-release.yml@06856d54d8829929e387523e6c1767d54416e978
    with:
      server-name: uisp-mcp
      image-name: ghcr.io/wyre-ai/uisp-mcp
    secrets: inherit

# NO `deploy:` job — deliberate. UISP is a CONDUIT-ONLY vendor.
#
# The fleet-standard `mcp-server-deploy.yml` deploys to `gwp-<slug>` in the
# `mcp-gateway-prod` resource group — the separate legacy fleet, NOT conduit.
# Confirmed uisp is wired into conduit's src/credentials/vendor-config.ts
# (containerUrl: "http://uisp-mcp", Conduit sidecar pattern) and is NOT
# present in conduit's azure/vendor-fleet.conduit-prod.bicepparam yet — that
# wiring is separate, later work, not this scaffolding fix. There is no
# `gwp-uisp` Container App and no federated credential registered for this
# repo, so a deploy job here could only ever fail (permanently red leg).
# Matches the other conduit-only vendors: keeper-mcp, nutanix-mcp,
# connectwise-cpq-mcp, scalepad-mcp, clio-mcp.
